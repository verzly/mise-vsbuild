name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Run static checks
        run: mise run static

  lua-syntax:
    name: Lua syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Run Lua syntax checks
        run: mise run lua-syntax

  plugin-smoke:
    name: Plugin smoke test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Link plugin
        shell: pwsh
        run: mise plugin link vsbuild "$PWD"
      - name: List versions without discovery
        shell: pwsh
        run: |
          $env:VSBUILD_DISABLE_DISCOVERY = '1'
          mise ls-remote vsbuild | Tee-Object -FilePath versions.txt
          rustc .github/scripts/ci-checks.rs -o ci-checks.exe
          .\ci-checks.exe version-list versions.txt
      - name: Check env options
        shell: pwsh
        run: |
          mise config set env._.vsbuild.workloads "Microsoft.VisualStudio.Workload.VCTools"
          mise config set env._.vsbuild.components "Microsoft.VisualStudio.Component.VC.CMake.Project"
          mise config set env._.vsbuild.install_method "winget"
          mise config set env._.vsbuild.include_recommended false
          mise config set env._.vsbuild.include_optional true
          mise config set env._.vsbuild.verbose true
          mise config set env._.vsbuild.dry_run true
          mise env --dotenv | Tee-Object -FilePath env.txt
          .\ci-checks.exe env-options env.txt
