name: Test VS Build Tools Plugin

on:
  pull_request:
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-label:
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.check.outputs.should-run }}
    steps:
      - id: check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ contains(github.event.pull_request.labels.*.name, 'needs-ci') }}" = "true" ]; then
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should-run=false" >> "$GITHUB_OUTPUT"
          fi

  list-versions:
    name: List versions - Windows
    needs: check-label
    if: needs.check-label.outputs.should-run == 'true'
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Install mise
        uses: jdx/mise-action@v4
        with:
          install: false
          cache: false

      - name: Register plugin from PR source
        shell: pwsh
        run: mise plugin link vsbuildtools "${{ github.workspace }}"

      - name: Check built-in version listing
        shell: pwsh
        run: |
          mise ls-remote vsbuildtools | Tee-Object -FilePath versions.txt

          foreach ($version in @('current', '2026', '2022', '2019', '2017', 'latest', 'stable')) {
            if (-not (Select-String -Path versions.txt -Pattern "^$version\s*$" -Quiet)) {
              throw "Expected version '$version' in version list"
            }
          }
