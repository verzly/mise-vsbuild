name: Update latest

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      target:
        description: 'Target release tag, for example v0.1.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  latest:
    name: Move latest tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve target
        id: target
        run: |
          if [ -n "${{ github.event.inputs.target }}" ]; then
            echo "target=${{ github.event.inputs.target }}" >> "$GITHUB_OUTPUT"
          else
            echo "target=${{ github.event.release.tag_name }}" >> "$GITHUB_OUTPUT"
          fi
      - name: Move latest tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch --tags
          git tag -f latest "${{ steps.target.outputs.target }}"
          git push origin latest --force
